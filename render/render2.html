<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>render2</title>
<style>body{margin:0;background:#111;color:#ccc;font:14px sans-serif}#out{width:960px;height:540px;display:block}</style>
</head><body>
<canvas id="out"></canvas><div id="log"></div>
<script id="fs1" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec3 uRo, uTa; uniform float uZoom, uT;
uniform int uScene;            // 0 studio pod, 1 clinic, 2 home cup, 3 home pen
uniform float uExplode, uLed, uBar, uScrB, uKey, uRip, uSpin;
uniform vec4 uPod0, uPod1;      // xyz pos, w yaw
uniform vec2 uPodT;             // tilt (x axis) of pod0, pod1
uniform vec4 uBound;
uniform vec4 uCupT;             // xyz translation, w roll
uniform vec4 uPen0, uPen1;      // pen tip xyz + radius, pen end xyz
uniform vec4 uStrapC, uStrapA;  // strap centre (w on), axis (w radius)
uniform vec4 uCA[80], uCB[80];
uniform ivec2 uGR[6]; uniform vec4 uGB[6]; uniform vec4 uGZ[6]; uniform float uGK[6]; uniform int uNG;
uniform sampler2D uScr, uPaper;
out vec4 fragColor;

const float TILT = 0.28;
const vec3 SUN_C = normalize(vec3(-0.72, 0.5, 0.48));
uniform float uBeam, uBeamH;
const vec3 WL = normalize(vec3(-0.87, 0.44, 0.23));
const vec3 KD = normalize(vec3(-0.55, 0.83, 0.5));

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdRR(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float extr(float d2, float py, float h, float r){ vec2 w=vec2(d2+r, abs(py)-h+r); return min(max(w.x,w.y),0.)+length(max(w,0.))-r; }
float smin(float a, float b, float k){ float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*0.25; }
vec2 opU(vec2 a, vec2 b){ return a.x<b.x?a:b; }
float capT(vec3 p, vec3 a, vec3 b, float ra, float rb){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(ra,rb,h); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }

// ---------------- probe module (studio, 1 unit = 1 cm) ----------------
vec2 probeModule(vec3 p, float e){
  vec3 ph=p+vec3(0.,e*0.9,0.);
  float outer=extr(length(ph.xz)-1.12, ph.y+0.05, 0.85, 0.12);
  float inner=extr(length(ph.xz)-0.98, ph.y-0.35, 0.75, 0.04);
  vec2 r=vec2(max(outer,-inner),2.);
  vec3 pk=ph-vec3(0.,-0.95,0.);
  r=opU(r,vec2(extr(sdRR(pk.xz,vec2(0.42,0.22),0.06), pk.y, 0.14, 0.03),9.));
  vec3 pw=p-vec3(0.,0.85+e*2.3,0.);
  r=opU(r,vec2(extr(length(pw.xz)-0.95, pw.y, 0.05, 0.035),3.));
  vec3 pr=p-vec3(0.,0.82+e*1.85,0.);
  r=opU(r,vec2(extr(abs(length(pr.xz)-1.03)-0.045, pr.y, 0.05, 0.02),13.));
  if(e>0.001){
    vec3 pl=p-vec3(0.,0.5+e*1.4,0.);
    r=opU(r,vec2((length(pl/vec3(0.72,0.17,0.72))-1.)*0.17,4.));
    vec3 pb=p-vec3(0.,0.25+e*0.95,0.);
    r=opU(r,vec2(extr(abs(length(pb.xz)-0.8)-0.07, pb.y, 0.28, 0.03),9.));
    vec3 pp=p-vec3(0.,-0.1+e*0.45,0.);
    r=opU(r,vec2(extr(length(pp.xz)-0.96, pp.y, 0.035, 0.01),5.));
    vec3 pc=pp-vec3(0.,0.06,0.);
    float ch=extr(sdRR(pc.xz,vec2(0.2,0.2),0.015), pc.y, 0.03, 0.006);
    vec3 pm=pp-vec3(0.,0.04,0.); pm.xz=abs(pm.xz)-vec2(0.52,0.0); 
    ch=min(ch, extr(sdRR(pm.xz,vec2(0.07,0.16),0.01), pm.y, 0.022, 0.004));
    vec3 pn=pp-vec3(0.,0.035,0.5); vec2 id=clamp(round(pn.xz/0.1),vec2(-2.,0.),vec2(2.,0.)); pn.xz-=id*0.1;
    ch=min(ch, extr(sdRR(pn.xz,vec2(0.03,0.02),0.004), pn.y, 0.014, 0.003));
    r=opU(r,vec2(ch,6.));
  }
  return r;
}
// ---------------- floor-standing tremor analyser (1 unit = 5 cm) ----------------
const vec3 S0=vec3(0.,22.,1.5); const vec3 SN=vec3(0.,0.6,0.8); const vec3 SV=vec3(0.,0.8,-0.6);
const float LEDGE_Y=19.0, PROBE_Z=5.0;
vec2 tower(vec3 p){
  float base=extr(sdRR(p.xz-vec2(0.,0.6), vec2(5.,4.2), 3.2), p.y-0.45, 0.45, 0.34);
  vec2 r=vec2(base,22.);
  float col=extr(sdRR(p.xz-vec2(0.,-0.3), vec2(1.45,1.05), 0.95), p.y-9.6, 8.7, 0.5);
  float head=extr(sdRR(p.xz, vec2(5.,3.0), 1.7), p.y-20.5, 2.6, 1.0);
  head=max(head, dot(p-S0,SN));
  float ledge=extr(sdRR(p.xz-vec2(0.,4.6), vec2(5.3,1.95), 1.6), p.y-LEDGE_Y, 0.55, 0.42);
  vec3 pq=vec3(p.x-clamp(round(p.x/3.5),-1.,1.)*3.5, p.y-(LEDGE_Y+0.45), p.z-PROBE_Z);
  float well=extr(length(pq.xz)-0.78, pq.y, 0.25, 0.06);
  float body=smin(smin(col,head,1.4), ledge, 0.9);
  body=max(body,-well);
  r=opU(r,vec2(body,1.));
  // probes
  float pr=extr(length(pq.xz)-0.6, pq.y-0.12, 0.22, 0.08);
  r=opU(r,vec2(pr,9.));
  vec3 pw=pq-vec3(0.,0.36,0.);
  r=opU(r,vec2(extr(length(pw.xz)-0.48, pw.y, 0.03, 0.025),3.));
  r=opU(r,vec2(extr(abs(length(pw.xz)-0.54)-0.03, pw.y+0.01, 0.025, 0.01),13.));
  // screen glass
  vec3 q=p-S0; float su=q.x, sv=dot(q,SV), sn=dot(q,SN);
  r=opU(r,vec2(extr(sdRR(vec2(su,sv), vec2(3.7,1.62), 0.35), sn, 0.03, 0.02),3.3));
  // light line on ledge front
  r=opU(r,vec2(extr(sdRR(vec2(p.x,p.y-LEDGE_Y), vec2(4.2,0.035), 0.035), p.z-6.535, 0.03, 0.01),13.));
  return r;
}
// ---------------- hands & sleeves (capsule groups) ----------------
vec2 hands(vec3 p, float best){
  vec2 res=vec2(1e9,0.);
  for(int g=0; g<6; g++){
    if(g>=uNG) break;
    vec4 B=uGB[g]; float bd=length(p-B.xyz)-B.w;
    if(bd>min(best,res.x) || bd>0.3){ res=opU(res,vec2(bd,uGZ[g].w)); continue; }
    float d=1e9; ivec2 R=uGR[g]; float k=uGK[g];
    for(int i=0;i<80;i++){ if(i>=R.y) break; int j=R.x+i;
      float c=capT(p,uCA[j].xyz,uCB[j].xyz,uCA[j].w,uCB[j].w); d = k>0. ? smin(d,c,k) : min(d,c); }
    res=opU(res,vec2(d,uGZ[g].w));
  }
  return res;
}
// ---------------- glass of water ----------------
float ripple(vec2 xz){ float r=length(xz); return uRip*(sin(r*9.-uT*22.)*0.55+sin(xz.x*6.3+uT*31.)*0.3+sin(xz.y*7.1-uT*27.)*0.2)*(0.35+r*0.55); }
vec2 glassW(vec3 p){
  vec3 q=p-uCupT.xyz; q.xy*=rot(uCupT.w);
  float r=length(q.xz);
  float outer=extr(r-1.3, q.y-1.8, 1.8, 0.06);
  float inner=max(r-1.225, 0.28-q.y);
  vec2 res=vec2(max(outer,-inner),10.);
  float surf=2.55+ripple(q.xz);
  res=opU(res,vec2(max(r-1.225, max(0.29-q.y, (q.y-surf)*0.7)),11.));
  return res;
}
vec2 map(vec3 p){
  if(uScene==0){ p.xz*=rot(uSpin); return probeModule(p,uExplode); }
  vec2 r=vec2(1e9,0.);
  if(uScene==1) r=tower(p);
  if(uScene==2) r=glassW(p);
  if(uScene==3){ r=vec2(capT(p,uPen0.xyz,uPen1.xyz,uPen0.w*0.25,uPen0.w),35.); }
  if(uNG>0) r=opU(r,hands(p,r.x));
  return r;
}
vec3 calcN(vec3 p){ const vec2 e=vec2(1,-1)*0.0009; return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x); }
vec2 march(vec3 ro, vec3 rd, float tmax){
  vec3 oc=ro-uBound.xyz; float b=dot(oc,rd); float c=dot(oc,oc)-uBound.w*uBound.w; float h=b*b-c;
  if(h<0.) return vec2(-1.);
  h=sqrt(h); float t=max(0.,-b-h); tmax=min(tmax,-b+h);
  for(int i=0;i<190;i++){
    vec2 d=map(ro+rd*t); float ad=abs(d.x);
    if(ad<0.0006+t*0.0002) return vec2(t,d.y);
    t+=ad*0.9; if(t>tmax) break;
  }
  return vec2(-1.);
}
float softSh(vec3 ro, vec3 rd, float k){
  vec3 oc=ro-uBound.xyz; float b=dot(oc,rd); float c=dot(oc,oc)-uBound.w*uBound.w;
  if(c>0. && (b>0. || b*b-c<0.)) return 1.;
  float res=1., t=0.015;
  for(int i=0;i<30;i++){
    vec2 h=map(ro+rd*t); float d=h.x;
    float s=k*d/t; if(h.y>9.5&&h.y<11.5) s=max(0.6,s);
    res=min(res,s); if(res<0.005) break; t+=clamp(abs(d),0.015,0.35); if(t>18.) break;
  }
  return clamp(res,0.,1.);
}
float ao(vec3 p, vec3 n){ float o=0.,s=1.; for(int i=1;i<=4;i++){ float h=0.04*float(i)*float(i)*0.6; o+=(h-map(p+n*h).x)*s; s*=0.7; } return clamp(1.-1.6*o,0.,1.); }
float box2(vec3 d, vec3 dir, vec2 sz){
  float c=dot(d,dir); if(c<=0.) return 0.;
  vec3 u=normalize(cross(dir, abs(dir.y)>0.99?vec3(1,0,0):vec3(0,1,0))); vec3 v=cross(u,dir);
  vec2 q=vec2(dot(d,u),dot(d,v))/c;
  return smoothstep(sz.x,sz.x*0.8,abs(q.x))*smoothstep(sz.y,sz.y*0.8,abs(q.y));
}
// environments
vec3 envStudio(vec3 d){
  vec3 c=mix(vec3(0.002),vec3(0.012,0.014,0.018),smoothstep(-0.3,0.8,d.y));
  c+=uKey*3.2*vec3(1.,0.98,0.95)*box2(d,KD,vec2(0.55,0.35));
  c+=4.5*vec3(0.85,0.93,1.0)*box2(d,normalize(vec3(-0.95,0.15,-0.5)),vec2(0.04,1.2));
  c+=4.5*vec3(0.85,0.93,1.0)*box2(d,normalize(vec3(0.95,0.15,-0.5)),vec2(0.04,1.2));
  c+=uKey*1.4*box2(d,vec3(0,1,0),vec2(1.0,0.07));
  return c;
}
float blinds(vec3 p){ // shadow mask of window blinds projected along sun
  float t=(-44.-p.x)/SUN_C.x; vec3 w=p+SUN_C*t;
  float win=smoothstep(-12.,-10.,w.z)*smoothstep(62.,60.,w.z)*smoothstep(14.,15.5,w.y)*smoothstep(76.,74.,w.y);
  float mul=step(0.06,abs(fract((w.z+12.)/24.)-0.5)*2.);
  float sl=smoothstep(0.30,0.45,fract(w.y*0.42))*smoothstep(0.99,0.86,fract(w.y*0.42));
  return win*mix(1.,sl,0.62)*mix(1.,mul,0.8);
}
vec3 envClinic(vec3 d){
  vec3 c=mix(vec3(0.30,0.29,0.28),vec3(0.52,0.55,0.58),smoothstep(-0.4,0.7,d.y));
  float w=box2(d,normalize(vec3(-1.,0.25,-0.15)),vec2(0.55,0.42));
  c+=w*vec3(3.4,3.2,2.9)*(0.75+0.25*smoothstep(0.3,0.5,fract(d.y*14.)));
  c+=2.2*box2(d,vec3(0.,1.,0.),vec2(0.25,0.6));
  return c*uKey;
}
vec3 envHome(vec3 d){
  vec3 c=mix(vec3(0.02,0.013,0.009),vec3(0.075,0.05,0.032),smoothstep(-0.2,0.5,d.y));
  c+=uKey*vec3(3.4,2.7,2.0)*box2(d,WL,vec2(0.55,0.65));
  for(int i=0;i<7;i++){ float fi=float(i);
    vec3 bd=normalize(vec3(-0.75+0.26*fi+0.05*sin(fi*5.), 0.12+0.12*sin(fi*2.3), -1.));
    c+=vec3(0.9,0.55,0.25)*(0.35+0.25*sin(fi*1.7))*smoothstep(0.05,0.035,length(d-bd)); }
  return c;
}
vec3 env(vec3 d){ return uScene==0?envStudio(d):uScene==1?envClinic(d):envHome(d); }
vec3 envBlur(vec3 r, float rough){
  vec3 t1=normalize(cross(r,vec3(0.3,1,0.2))), t2=cross(r,t1); float s=rough*0.5;
  return (env(r)*2.+env(normalize(r+t1*s))+env(normalize(r-t1*s))+env(normalize(r+t2*s))+env(normalize(r-t2*s)))/6.;
}
vec3 sunDir(){ return uScene==0?KD:uScene==1?SUN_C:WL; }
vec3 sunCol(){ return uScene==0?vec3(1.35):uScene==1?vec3(2.3,2.18,1.98):vec3(2.5,1.95,1.4); }
vec3 shade(vec3 p, vec3 n, vec3 rd, float m, bool lite){
  vec3 alb=vec3(0.8); float rough=0.4, metal=0., f0=0.04, sss=0.; vec3 emis=vec3(0.);
  vec3 v=-rd;
  vec3 lp=p; if(uScene==0) lp.xz*=rot(uSpin);
  if(m<1.5){ alb=vec3(0.80,0.805,0.80); rough=0.32; }
  else if(m<2.5){ alb=vec3(0.10,0.105,0.115); rough=0.32+0.06*sin(atan(lp.z,lp.x)*300.); metal=0.9; }
  else if(m<3.15){ alb=vec3(0.004,0.005,0.007); rough=0.03; f0=0.05; }
  else if(m<3.5){ vec3 q=p-S0; alb=vec3(0.004,0.005,0.006); rough=0.03; f0=0.045;
    vec2 uv=vec2(q.x/3.45*0.5+0.5, dot(q,SV)/1.45*0.5+0.5);
    if(all(greaterThan(uv,vec2(0.)))&&all(lessThan(uv,vec2(1.)))) emis=pow(texture(uScr,vec2(uv.x,1.-uv.y)).rgb,vec3(2.2))*uScrB*1.5;
  }
  else if(m<4.5){ alb=vec3(0.02,0.025,0.03); rough=0.05; f0=0.08;
    float th=dot(n,v); emis=vec3(0.04,0.02,0.06)*(1.-th)+vec3(0.02,0.05,0.03)*th; }
  else if(m<5.5){ vec3 q=lp; float rr=length(q.xz);
    float tr=smoothstep(0.012,0.0,abs(fract(rr*7.+atan(q.z,q.x)*0.6)-0.5)-0.45);
    alb=mix(vec3(0.01,0.07,0.045),vec3(0.8,0.62,0.3),tr); metal=tr; rough=mix(0.38,0.22,tr); }
  else if(m<6.5){ alb=vec3(0.02); rough=0.3; }
  else if(m<7.5){ alb=vec3(0.62,0.64,0.68); rough=0.3; metal=0.85; }
  else if(m<9.5){ alb=vec3(0.78,0.79,0.8); rough=0.18+0.05*sin(atan(lp.z,lp.x)*260.); metal=1.; }
  else if(m<13.5){ alb=vec3(0.02); rough=0.1; emis=uBar*vec3(0.25,0.8,1.0)*4.; }
  else if(m<22.5){ alb=vec3(0.2,0.21,0.22); rough=0.6; }
  else if(m<32.5){
    float sc=uScene==1?14.:7.;
    float nz=vnoise(p.xz*sc*0.6+p.y*3.)*0.55+vnoise(p.xy*sc*1.7+p.z)*0.45;
    vec3 bmp=vec3(vnoise(p.yz*sc*4.),vnoise(p.xz*sc*4.+5.),vnoise(p.xy*sc*4.+9.))-0.5;
    n=normalize(n+bmp*0.09);
    alb=(m<31.5?vec3(0.52,0.33,0.25):vec3(0.58,0.38,0.27))*(0.86+0.24*nz);
    alb=mix(alb, alb*vec3(1.08,0.86,0.82), smoothstep(0.55,0.8,vnoise(p.xz*sc*0.35+11.)));
    rough=0.52-0.12*nz; f0=0.03; sss=1.; }
  else if(m<33.5){ float k=0.5+0.5*sin(dot(p,vec3(31.,47.,13.))); alb=vec3(0.16,0.2,0.26)*(0.85+0.2*k); rough=0.92; }
  else if(m<34.5){ float k=vnoise(p.xy*30.); alb=vec3(0.86,0.87,0.88)*(0.96+0.06*k); rough=0.85; }
  else if(m<35.5){ alb=vec3(0.03,0.035,0.05); rough=0.18; f0=0.05; }
  else if(m<36.5){ float k=0.5+0.5*sin(p.x*90.)*sin(p.z*90.); alb=vec3(0.13,0.14,0.15)*(0.85+0.3*k); rough=0.9; }
  vec3 r=reflect(rd,n); float nv=max(dot(n,v),0.);
  vec3 F0=mix(vec3(f0),alb,metal);
  vec3 F=F0+(1.-F0)*pow(1.-nv,5.)*(1.-rough*0.7);
  float occ=lite?1.:ao(p,n);
  vec3 L=sunDir(), C=sunCol()*uKey;
  float ndl=dot(n,L);
  float dif=sss>0.?clamp((ndl+0.35)/1.35,0.,1.):max(ndl,0.);
  vec3 col=vec3(0.);
  if(dif>0.){
    float sh=lite?1.:softSh(p+n*0.01,L,12.);
    if(uScene==1) sh*=blinds(p);
    vec3 h=normalize(L+v); float sp=2./(rough*rough+0.001)-2.;
    vec3 dcol=alb*(1.-metal);
    if(sss>0.){ dcol*=mix(vec3(1.),vec3(1.25,0.75,0.6),smoothstep(0.35,0.,abs(ndl))*0.8); sh=mix(sh,1.,0.12); }
    col+=C*dif*sh*(dcol+F*(sp+8.)/25.*pow(max(dot(n,h),0.),sp)*max(ndl,0.));
  }
  if(uScene==0){ for(int k=0;k<2;k++){ vec3 Lr=normalize(vec3(k==0?-0.95:0.95,0.15,-0.5)); float d2=max(dot(n,Lr),0.);
    vec3 h=normalize(Lr+v); float sp=2./(rough*rough+0.001)-2.; col+=0.8*vec3(0.85,0.93,1.)*d2*(alb*(1.-metal)*0.5+F*(sp+8.)/25.*pow(max(dot(n,h),0.),sp)); } }
  float amb=uScene==0?0.3:uScene==1?0.62:0.55;
  vec3 sssAmb=sss>0.?vec3(1.08,0.95,0.9):vec3(1.);
  col+=alb*(1.-metal)*envBlur(n,1.4)*amb*occ*sssAmb;
  col+=F*envBlur(r,rough)*occ;
  return col+emis;
}
vec3 shadeFloor(vec3 p, vec3 rd){
  vec3 n=vec3(0,1,0), rr=reflect(rd,n), alb; float rough, fr;
  float sh=softSh(p+n*0.01,sunDir(),14.);
  if(uScene==1){
    float tile=smoothstep(0.012,0.0,min(abs(fract(p.x/12.)-0.5),abs(fract(p.z/12.)-0.5))-0.495);
    alb=vec3(0.66,0.665,0.66)*(0.95+0.05*vnoise(p.xz*0.8)+0.03*vnoise(p.xz*6.))*(1.-tile*0.25); rough=0.38;
    sh*=blinds(p);
    fr=0.04+0.96*pow(1.-max(-rd.y,0.),5.);
  } else {
    float g=sin(p.x*3.1+sin(p.z*0.7)*2.2+sin(p.x*0.8+p.z*0.3)*1.5); float g2=sin(p.x*8.+sin(p.z*1.3)*3.)*0.5+0.5;
    alb=mix(vec3(0.15,0.08,0.042),vec3(0.27,0.155,0.08),0.5+0.2*g)*(0.86+0.14*g2); rough=0.35;
    if(uScene==3 && abs(p.x-0.)<5.2 && abs(p.z-0.)<3.8){ // paper
      vec2 uv=vec2(p.x/10.4+0.5, p.z/7.6+0.5);
      vec3 ink=texture(uPaper,uv).rgb; alb=vec3(0.86,0.85,0.82)*pow(ink,vec3(2.2))*(0.97+0.03*vnoise(p.xz*40.)); rough=0.8; }
    fr=0.04+0.96*pow(1.-max(-rd.y,0.),5.);
  }
  float occ=clamp(map(p+vec3(0.,0.12,0.)).x*2.4,0.,1.)*0.6+0.4;
  vec3 col=alb*(sunCol()*uKey*max(sunDir().y,0.)*sh+envBlur(n,1.4)*(uScene==1?0.62:0.12))*occ;
  if(uScene==2){ vec2 cc=uCupT.xz-WL.xz*(1.45/WL.y); vec2 dd=(p.xz-cc)*vec2(1.05,1.9);
    col+=alb*vec3(2.4,1.9,1.2)*exp(-dot(dd,dd)*3.2)*(0.75+0.25*sin(p.x*14.+uT*20.))*smoothstep(0.9,0.4,sh)*uKey*1.2; }
  vec3 refl;
  vec2 h2=march(p+n*0.002,rr,30.);
  if(h2.x>0.){ vec3 q=p+rr*h2.x; refl=shade(q,calcN(q),rr,h2.y,true); } else refl=envBlur(rr,rough);
  col+=refl*fr*mix(0.9,0.25,rough);
  if(uScene!=1) col*=smoothstep(-9.,-2.5,p.z);
  return col;
}
vec3 shadeWall(vec3 p){
  vec3 alb=vec3(0.74,0.735,0.72)*(0.97+0.03*vnoise(p.xy*0.5));
  if(p.y<2.) alb=vec3(0.5,0.5,0.5);
  float sh=blinds(p)*softSh(p+vec3(0,0,0.02),SUN_C,10.);
  vec3 c=alb*(sunCol()*uKey*max(SUN_C.z,0.)*sh + vec3(0.5,0.52,0.55)*uKey*(0.75+0.25*smoothstep(0.,40.,p.y)));
  return c;
}
vec3 beams(vec3 ro, vec3 rd, float tmax){
  vec3 g=vec3(0.);
  for(int i=-1;i<=1;i++){
    vec3 A=vec3(float(i)*3.5, LEDGE_Y+0.82, PROBE_Z);
    vec3 w0=ro-A; float b=rd.y, d=dot(rd,w0), e=w0.y; float den=max(1.-b*b,1e-4);
    float s=clamp((e-b*d)/den, 0., uBeamH);
    float t=dot(A+vec3(0.,s,0.)-ro, rd);
    if(t<=0. || t>tmax) continue;
    float dist=length(ro+rd*t-(A+vec3(0.,s,0.)));
    float fade=smoothstep(0.,0.3,s)*(0.6+0.4*smoothstep(uBeamH,uBeamH*0.6,s));
    g+=vec3(0.3,0.85,1.0)*(exp(-pow(dist/0.035,2.))*1.6+exp(-dist/0.22)*0.12)*fade;
  }
  return g*uBeam;
}
vec4 trace(vec3 ro, vec3 rd){
  if(uScene==0){ vec2 h=march(ro,rd,60.); if(h.x>0.){ vec3 p=ro+rd*h.x; return vec4(shade(p,calcN(p),rd,h.y,false),h.x); }
    return vec4(mix(vec3(0.002,0.0025,0.003),vec3(0.008,0.009,0.012),smoothstep(-0.3,0.4,rd.y)),60.); }
  vec3 col=vec3(0.), thr=vec3(1.); float firstT=-1.;
  for(int b=0;b<7;b++){
    float tp=rd.y<0.?-ro.y/rd.y:1e9;
    float tw=(uScene==1&&rd.z<0.)?(-26.-ro.z)/rd.z:1e9;
    vec2 h=march(ro,rd,min(min(tp,tw),80.));
    if(h.x<0.){
      if(tp<tw && tp<1e8){ vec3 p=ro+rd*tp; if(firstT<0.) firstT=tp; col+=thr*shadeFloor(p,rd); }
      else if(tw<1e8){ vec3 p=ro+rd*tw; if(firstT<0.) firstT=tw; col+=thr*shadeWall(p); }
      else { if(firstT<0.) firstT=80.; col+=thr*env(rd); }
      break;
    }
    vec3 p=ro+rd*h.x; vec3 n=calcN(p); if(firstT<0.) firstT=h.x;
    if(h.y>9.5 && h.y<11.5){
      bool ent=dot(rd,n)<0.; vec3 nn=ent?n:-n;
      float ior=h.y<10.5?1.5:1.33; float eta=ent?1./ior:ior;
      float c=max(dot(-rd,nn),0.); float fr=0.04+0.96*pow(1.-c,5.);
      vec3 rf=reflect(rd,nn); col+=thr*fr*env(rf);
      vec3 hh=normalize(WL-rd); col+=thr*sunCol()*uKey*pow(max(dot(nn,hh),0.),300.)*1.5;
      vec3 rr=refract(rd,nn,eta);
      if(dot(rr,rr)<0.01){ rd=rf; ro=p+nn*0.004; continue; }
      thr*=(1.-fr)*(h.y<10.5?vec3(0.975,0.99,0.985):vec3(0.62,0.78,0.84));
      if(h.y>10.5 && ent) col+=thr*vec3(0.02,0.04,0.05);
      rd=rr; ro=p-nn*0.004;
    } else { col+=thr*shade(p,n,rd,h.y,false); break; }
  }
  return vec4(col,firstT);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  vec3 f=normalize(uTa-uRo), r=normalize(cross(f,vec3(0,1,0))), u=cross(r,f);
  vec3 rd=normalize(uv.x*r+uv.y*u+uZoom*f);
  vec4 c=trace(uRo,rd);
  if(uScene==1 && uBeam>0.) c.rgb+=beams(uRo,rd,c.a);
  fragColor=c;
}
</script>
<script id="fs2" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uOut; uniform float uFocus, uAper, uMaxR, uExpo, uGrade, uScale;
out vec4 fragColor;
float coc(float d){ return clamp(uAper*abs(d-uFocus)/max(d,0.001), 0., uMaxR); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
void main(){
  vec2 uv=gl_FragCoord.xy/uOut*uScale; vec2 px=uScale/uOut;
  vec4 c0=texture(uTex,uv); float cc=coc(c0.a);
  vec3 acc=c0.rgb; float wsum=1.;
  if(uMaxR>0.5){
    const int N=56; const float GA=2.39996323;
    for(int i=1;i<N;i++){
      float fi=float(i); float r=sqrt(fi/float(N))*uMaxR; vec2 o=vec2(cos(fi*GA),sin(fi*GA))*r;
      vec4 s=texture(uTex,uv+o*px); float cs=coc(s.a);
      float w=smoothstep(r-1.,r+0.5,cs);
      if(s.a>c0.a) w*=smoothstep(r-1.,r+0.5,cc);
      acc+=s.rgb*w; wsum+=w;
    }
  }
  vec3 col=acc/wsum*uExpo;
  col=aces(col);
  col=pow(col,vec3(1./2.2));
  // subtle grade: lift blacks slightly toward teal, warm highlights
  col=mix(col, col*vec3(1.02,1.0,0.98)+vec3(0.004,0.006,0.008), uGrade);
  vec2 q=uv-0.5; col*=1.-dot(q,q)*0.55;
  fragColor=vec4(col,1.);
}
</script>
